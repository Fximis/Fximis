  </defs>

  <rect width="854" height="175" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="852" height="173" rx="11" fill="none" stroke="#00f0ff" stroke-opacity="0.22" stroke-width="1"/>

  <path d="M0 130 Q 213.5 165 427 135 T 854 150 L 854 175 L 0 175 Z" fill="url(#waveGrad)" opacity="0.16">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
