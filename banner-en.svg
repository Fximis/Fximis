              M0 145 Q 213.5 115 427 150 T 854 130 L 854 175 L 0 175 Z;
              M0 130 Q 213.5 165 427 135 T 854 150 L 854 175 L 0 175 Z" />
  </path>

  <rect x="48" y="32" width="4" height="112" rx="2" fill="url(#accentGrad)"/>

  <text x="68" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    Fellipe M. Schmidt
  </text>

  <text x="68" y="98" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" font-weight="600">
