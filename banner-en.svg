  <rect x="222" y="116" width="144" height="24" rx="5" fill="#120f24" fill-opacity="0.85" stroke="url(#pillBorder)" stroke-width="1"/>
  <text x="294" y="132" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">TDD &amp; CI/CD</text>

  <rect x="376" y="116" width="154" height="24" rx="5" fill="#120f24" fill-opacity="0.85" stroke="#ff007f" stroke-opacity="0.5" stroke-width="1"/>
  <text x="453" y="132" text-anchor="middle" fill="#ff7ab8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">Security by Design</text>
